<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Maison principale -->
  <rect x="20" y="30" width="20" height="22" fill="#E8C87A" stroke="#C4A050" stroke-width="1"/>
  <!-- Toit -->
  <polygon points="16,30 30,14 44,30" fill="#C85040" stroke="#A03830" stroke-width="1"/>
  <!-- Porte -->
  <rect x="27" y="40" width="8" height="12" rx="4" fill="#8B5E3C"/>
  <!-- Poignée -->
  <circle cx="33" cy="47" r="0.8" fill="#C4A050"/>
  <!-- Fenêtre gauche -->
  <rect x="22" y="34" width="5" height="5" rx="0.5" fill="#A8D8F0" stroke="#7AB0C8" stroke-width="0.8"/>
  <line x1="24.5" y1="34" x2="24.5" y2="39" stroke="#7AB0C8" stroke-width="0.5"/>
  <line x1="22" y1="36.5" x2="27" y2="36.5" stroke="#7AB0C8" stroke-width="0.5"/>
  <!-- Fenêtre droite -->
  <rect x="35" y="34" width="5" height="5" rx="0.5" fill="#A8D8F0" stroke="#7AB0C8" stroke-width="0.8"/>
  <line x1="37.5" y1="34" x2="37.5" y2="39" stroke="#7AB0C8" stroke-width="0.5"/>
  <line x1="35" y1="36.5" x2="40" y2="36.5" stroke="#7AB0C8" stroke-width="0.5"/>
  <!-- Petite maison gauche -->
  <rect x="4" y="38" width="14" height="14" fill="#D8B868" stroke="#B89848" stroke-width="1"/>
  <polygon points="2,38 11,26 20,38" fill="#B84838" stroke="#983028" stroke-width="1"/>
  <rect x="8" y="42" width="5" height="5" rx="0.5" fill="#A8D8F0" stroke="#7AB0C8" stroke-width="0.8"/>
  <!-- Petite maison droite -->
  <rect x="46" y="38" width="14" height="14" fill="#D8B868" stroke="#B89848" stroke-width="1"/>
  <polygon points="44,38 53,28 62,38" fill="#B84838" stroke="#983028" stroke-width="1"/>
  <rect x="50" y="42" width="5" height="5" rx="0.5" fill="#A8D8F0" stroke="#7AB0C8" stroke-width="0.8"/>
  <!-- Sol -->
  <rect x="0" y="52" width="64" height="12" fill="#7DB856" rx="2"/>
  <!-- Arbre -->
  <rect x="48" y="44" width="2" height="8" fill="#8B5E3C"/>
  <circle cx="49" cy="40" r="5" fill="#5D8C3E"/>
</svg>
