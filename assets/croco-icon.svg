  <path d="M22 26 C16 24 10 22 6 18 C3 15 2 17 4 20 C6 23 10 28 14 32 C16 34 20 36 22 36Z" stroke="#4A7030" stroke-width="0.8" fill="none"/>
  <!-- Pointe queue -->
  <path d="M6 18 C3 14 1 15 2 17" fill="#5D8C3E"/>

